<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Swimmers</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="My Swimmers" />
<style>
:root{--bg:#eef9ff;--card:#fff;--blue:#0ea5e9;--deep:#082f49;--line:#dbeafe;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#e0f2fe,#f8fdff);color:var(--text);padding-bottom:100px}.app{max-width:560px;margin:0 auto;padding:18px}h1{margin:6px 0;font-size:32px}.subtitle{font-size:14px;color:var(--muted)}.wave-card{padding:18px;border-radius:28px;background:linear-gradient(135deg,#082f49,#0ea5e9);color:#fff;margin:14px 0}.big-stat{display:flex;gap:10px;margin-top:14px}.stat-box{flex:1;background:rgba(255,255,255,.16);padding:8px;border-radius:18px}.stat-box strong{display:block;font-size:24px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.swimmer-tab{border:0;padding:14px;border-radius:20px;font-size:16px;font-weight:800;background:#fff}.swimmer-tab.active{background:var(--deep);color:#fff}.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:16px;border:1px solid var(--line)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pill-row{display:flex;gap:8px;margin-bottom:12px}.pill{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;font-weight:700}.pill.active{background:var(--blue);color:#fff}.note{font-size:12px;color:var(--muted);line-height:1.45}.form-grid{display:flex;flex-direction:column;gap:10px}input,select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);font-size:16px}.label-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.label-grid input{font-size:13px;padding:10px 8px;text-align:center;font-weight:800}.primary-btn{width:100%;border:0;padding:14px;border-radius:18px;background:linear-gradient(135deg,#0284c7,#06b6d4);color:#fff;font-weight:900;margin-top:12px}.secondary-btn{border:0;padding:8px 10px;border-radius:999px;background:#e0f2fe;font-weight:800;color:var(--deep)}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:var(--deep);color:#fff;padding:8px 4px;font-size:11px;word-break:break-word}td{padding:7px 4px;border-bottom:1px solid #e2e8f0;font-size:12px;text-align:center}.event-name{font-weight:800;text-align:left;background:#f8fafc}.pb-cell{background:#fef9c3;font-weight:900;font-size:15px;color:var(--deep);cursor:pointer}.good{background:#dcfce7}.close{background:#fef3c7}.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px;border-radius:22px;background:rgba(255,255,255,.96);border:1px solid #dbeafe}.nav-btn{border:0;padding:12px 6px;background:transparent;border-radius:14px;font-weight:800}.nav-btn.active{background:#e0f2fe;color:var(--deep)}.hidden{display:none}.event-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;background:#e0f2fe;border-radius:999px;font-size:12px;font-weight:800;margin:4px}.cut-row{display:grid;grid-template-columns:1fr;gap:8px}.cut-label{font-size:12px;font-weight:900;color:#0369a1;margin-bottom:3px}
</style>
</head>
<body>
<div class="app">
<header><div style="font-size:12px;font-weight:800;color:#0369a1">My Swimmers</div><h1>My Swimmers</h1><div class="subtitle">수영 기록 · CUT · 시즌 비교</div></header>
<section class="wave-card"><div>현재 선택 선수</div><h2 id="heroName">Bomin</h2><div class="big-stat"><div class="stat-box"><strong id="totalRecords">0</strong><span>Records</span></div><div class="stat-box"><strong id="pbCount">0</strong><span>PB Events</span></div><div class="stat-box"><strong id="eventCount">0</strong><span>Events</span></div></div></section>
<div class="tabs"><button class="swimmer-tab active" data-swimmer="Bomin">Bomin</button><button class="swimmer-tab" data-swimmer="Jayha">Jayha</button></div>
<main id="screen-dashboard"><section class="card"><div class="section-title"><h3>Time Standards</h3><span class="note">기록 칸 누르면 바로 입력</span></div><div class="pill-row"><button class="pill" id="courseLCM">LONG</button><button class="pill active" id="courseSCY">SHORT</button></div><div id="profileNote" class="note" style="margin-bottom:10px"></div><div style="overflow-x:auto"><table id="standardsTable"></table></div></section></main>
<main id="screen-cuts" class="hidden"><section class="card"><h3>CUT 수정</h3><div class="note" style="margin-bottom:8px">위 3개 이름도 직접 바꿀 수 있어. 예: WAG, SPRING JO, JR NATIONAL</div><div class="label-grid"><input id="label1"><input id="label2"><input id="label3"></div><button class="secondary-btn" id="saveLabelsBtn" style="margin:10px 0 16px">기준 이름 저장</button><div class="form-grid"><div style="display:flex;gap:8px;align-items:center"><select id="cutEventSelect" style="flex:1"></select><button type="button" class="secondary-btn" id="quickAddEventBtn">＋</button></div><select id="cutCourseSelect"><option value="LCM">LCM</option><option value="SCY">SCY</option></select><div class="cut-row"><div><div class="cut-label" id="cutLabel1"></div><input id="cut1" placeholder="time"></div><div><div class="cut-label" id="cutLabel2"></div><input id="cut2" placeholder="time"></div><div><div class="cut-label" id="cutLabel3"></div><input id="cut3" placeholder="time"></div></div></div><button class="primary-btn" id="saveCutsBtn">CUT 저장</button><div style="margin-top:18px;padding-top:18px;border-top:1px solid #dbeafe"><div id="eventEditList"></div><div class="note" style="margin-top:8px">✕로 종목 삭제 · 새 종목은 ＋ 버튼</div></div></section></main>
</div>
<nav class="bottom-nav"><button class="nav-btn active" data-screen="dashboard">기록</button><button class="nav-btn" data-screen="cuts">CUT</button></nav>
<script>
const STORAGE_KEY='my-swimmers-stable-v2';
const EVENTS_KEY='my-swimmers-events-by-swimmer';
const LABELS_KEY='my-swimmers-cut-labels-v1';
const defaultEvents={
Bomin:['SCY|50 Free','SCY|100 Free','SCY|200 Free','SCY|500 Free','SCY|50 Back','SCY|100 Back','SCY|200 Back','SCY|50 Fly','SCY|100 Fly','SCY|200 Fly','SCY|100 Breast','SCY|200 Breast','SCY|200 IM','SCY|400 IM','LCM|50 Free','LCM|100 Free','LCM|200 Free','LCM|400 Free','LCM|50 Back','LCM|100 Back','LCM|200 Back','LCM|50 Fly','LCM|100 Fly','LCM|200 Fly','LCM|50 Breast','LCM|100 Breast','LCM|200 Breast','LCM|200 IM','LCM|400 IM'],
Jayha:['SCY|50 Free','SCY|100 Free','SCY|200 Free','SCY|500 Free','SCY|50 Back','SCY|100 Back','SCY|200 Back','SCY|50 Fly','SCY|100 Fly','SCY|200 Fly','SCY|100 Breast','SCY|200 Breast','SCY|200 IM','SCY|400 IM','LCM|50 Free','LCM|100 Free','LCM|200 Free','LCM|400 Free','LCM|50 Back','LCM|100 Back','LCM|200 Back','LCM|50 Fly','LCM|100 Fly','LCM|200 Fly','LCM|100 Breast','LCM|200 Breast','LCM|200 IM','LCM|400 IM']};
let swimmerEvents=JSON.parse(localStorage.getItem(EVENTS_KEY)||JSON.stringify(defaultEvents));
let cutLabels=JSON.parse(localStorage.getItem(LABELS_KEY)||JSON.stringify({Bomin:['SECTIONAL','FUTURE','JR NATIONAL'],Jayha:['ELITE','JAG','SAG']}));
if(!cutLabels.Bomin)cutLabels.Bomin=['SECTIONAL','FUTURE','JR NATIONAL'];
if(!cutLabels.Jayha)cutLabels.Jayha=['ELITE','JAG','SAG'];
const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"records":[],"cuts":{}}');
if(!data.records)data.records=[];if(!data.cuts)data.cuts={};
let currentSwimmer='Bomin',currentCourse='SCY';
const jayhaDefaults={
'50 Free-SCY':['26.50','28.00','29.50'],'100 Free-SCY':['58.50','1:02.00','1:06.00'],'200 Free-SCY':['2:08.00','2:18.00','2:28.00'],'50 Back-SCY':['30.50','32.50','34.50'],'100 Back-SCY':['1:05.00','1:10.00','1:15.00'],'100 Breast-SCY':['1:12.00','1:18.00','1:24.00'],'200 Breast-SCY':['2:38.00','2:48.00','2:58.00'],'50 Fly-SCY':['28.50','30.50','32.50'],'100 Fly-SCY':['1:04.00','1:09.00','1:14.00'],'50 Free-LCM':['31.20','32.50','32.30'],'100 Free-LCM':['1:07.40','1:10.40','1:10.40'],'200 Free-LCM':['2:27.10','2:35.90','2:34.30'],'50 Back-LCM':['36.70','38.60','38.50'],'100 Back-LCM':['1:17.80','1:24.30','1:24.30'],'100 Breast-LCM':['1:17.80','1:35.30','1:35.00'],'50 Fly-LCM':['34.50','36.10','35.90'],'100 Fly-LCM':['1:16.80','1:23.60','1:23.60'],'200 IM-LCM':['2:47.10','2:55.80','2:54.40']};
const bominBase={
'50 Free-SCY':['22.19','21.29'],'100 Free-SCY':['48.19','46.39'],'200 Free-SCY':['1:45.79','1:41.59'],'50 Back-SCY':['24.79','23.69'],'100 Back-SCY':['53.89','51.49'],'200 Back-SCY':['1:57.29','1:52.79'],'50 Free-LCM':['25.89','24.59'],'100 Free-LCM':['56.09','51.99'],'200 Free-LCM':['2:03.09','1:57.79'],'50 Back-LCM':['29.29','27.89'],'100 Back-LCM':['1:03.29','1:00.59'],'200 Back-LCM':['2:17.39','2:11.89']};
const jrNational={
'50 Free-SCY':'20.39','100 Free-SCY':'44.39','200 Free-SCY':'1:37.59','500 Free-SCY':'4:25.59','50 Back-SCY':'22.49','100 Back-SCY':'48.59','200 Back-SCY':'1:46.49','50 Breast-SCY':'25.29','100 Breast-SCY':'54.99','200 Breast-SCY':'2:00.39','50 Fly-SCY':'21.99','100 Fly-SCY':'48.19','200 Fly-SCY':'1:47.89','200 IM-SCY':'1:48.49','400 IM-SCY':'3:52.69','50 Free-LCM':'23.79','100 Free-LCM':'51.99','200 Free-LCM':'1:54.09','400 Free-LCM':'4:02.19','50 Back-LCM':'26.69','100 Back-LCM':'58.19','200 Back-LCM':'2:06.99','50 Breast-LCM':'29.59','100 Breast-LCM':'1:05.09','200 Breast-LCM':'2:22.39','50 Fly-LCM':'25.39','100 Fly-LCM':'55.89','200 Fly-LCM':'2:05.09','200 IM-LCM':'2:07.99','400 IM-LCM':'4:33.09'};
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function saveEvents(){localStorage.setItem(EVENTS_KEY,JSON.stringify(swimmerEvents))}
function saveLabels(){localStorage.setItem(LABELS_KEY,JSON.stringify(cutLabels))}
function timeToSeconds(t){if(!t||t==='-')return null;const s=String(t).trim();if(s.includes(':')){const p=s.split(':');return Number(p[0])*60+Number(p[1])}const n=Number(s);return Number.isFinite(n)?n:null}
function secondsToTime(sec){if(sec==null||isNaN(sec))return '-';if(sec>=60){const m=Math.floor(sec/60),s=(sec-m*60).toFixed(2).padStart(5,'0');return `${m}:${s}`}return Number(sec).toFixed(2)}
function getPB(ev,course){const arr=data.records.filter(r=>r.swimmer===currentSwimmer&&r.event===ev&&r.course===course).map(r=>timeToSeconds(r.time)).filter(v=>v!=null);return arr.length?Math.min(...arr):null}
function slotKey(swimmer,ev,course){return `${swimmer}-${ev}-${course}`}
function ensureCuts(swimmer,ev,course){const key=slotKey(swimmer,ev,course);if(!data.cuts[key])data.cuts[key]={};const c=data.cuts[key];if(swimmer==='Bomin'){
if(c.CUT1==null)c.CUT1=c.SECTIONAL??bominBase[`${ev}-${course}`]?.[0]??'-';
if(c.CUT2==null)c.CUT2=c.FUTURE??bominBase[`${ev}-${course}`]?.[1]??'-';
if(c.CUT3==null)c.CUT3=c.JR_NATIONAL??jrNational[`${ev}-${course}`]??'-';
}else{
const d=jayhaDefaults[`${ev}-${course}`]||['-','-','-'];
if(c.CUT1==null)c.CUT1=c.ELITE??d[0];if(c.CUT2==null)c.CUT2=c.JAG??d[1];if(c.CUT3==null)c.CUT3=c.SAG??d[2];}
return c}
function normalizeEvents(){Object.keys(defaultEvents).forEach(name=>{if(!swimmerEvents[name])swimmerEvents[name]=defaultEvents[name];swimmerEvents[name]=swimmerEvents[name].map(x=>String(x).includes('|')?x:`SCY|${x}`).filter((v,i,a)=>a.indexOf(v)===i)});saveEvents()}
function renderStats(){const recs=data.records.filter(r=>r.swimmer===currentSwimmer);heroName.textContent=currentSwimmer;totalRecords.textContent=recs.length;pbCount.textContent=new Set(recs.map(r=>`${r.course}|${r.event}`)).size;eventCount.textContent=(swimmerEvents[currentSwimmer]||[]).length;document.querySelectorAll('.swimmer-tab').forEach(b=>b.classList.toggle('active',b.dataset.swimmer===currentSwimmer));profileNote.textContent=currentSwimmer==='Jayha'?'현재 11–12 기준은 그대로 유지. WAG / Spring JO 끝날 때까지 사용 가능.':'2026 Junior National 남자 기준 포함.'}
function renderTable(){const labels=cutLabels[currentSwimmer];let h=`<thead><tr><th>${currentCourse}</th>${labels.map(x=>`<th>${x}</th>`).join('')}<th>${currentSwimmer}</th></tr></thead><tbody>`;const list=(swimmerEvents[currentSwimmer]||[]).filter(x=>x.startsWith(currentCourse+'|'));for(const raw of list){const ev=raw.split('|')[1],pb=getPB(ev,currentCourse),c=ensureCuts(currentSwimmer,ev,currentCourse);h+=`<tr><td class="event-name">${ev}</td>`;['CUT1','CUT2','CUT3'].forEach(k=>{const cut=c[k]||'-';let diff='-',cls='';const cs=timeToSeconds(cut);if(cs!=null&&pb!=null){const g=pb-cs;if(g<=0){diff='✓';cls='good'}else{diff=g.toFixed(2);cls='close'}}h+=`<td class="${cls}">${cut}<div class="note">${diff}</div></td>`});h+=`<td class="pb-cell event-entry-cell" data-event="${ev}">${pb!=null?secondsToTime(pb):'입력'}</td></tr>`}standardsTable.innerHTML=h+'</tbody>';saveData()}
function refreshDropdowns(){const list=(swimmerEvents[currentSwimmer]||[]).filter(x=>x.startsWith(currentCourse+'|')).map(x=>x.split('|')[1]);cutEventSelect.innerHTML=list.map(x=>`<option>${x}</option>`).join('');cutCourseSelect.value=currentCourse;eventEditList.innerHTML=list.map(x=>`<span class="event-chip">${x}<button data-remove="${currentCourse}|${x}" style="border:0;background:none;color:#ef4444;font-weight:900">✕</button></span>`).join('');loadCutForm()}
function renderLabels(){const l=cutLabels[currentSwimmer];label1.value=l[0];label2.value=l[1];label3.value=l[2];cutLabel1.textContent=l[0];cutLabel2.textContent=l[1];cutLabel3.textContent=l[2]}
function loadCutForm(){renderLabels();const ev=cutEventSelect.value;if(!ev){cut1.value=cut2.value=cut3.value='';return}const c=ensureCuts(currentSwimmer,ev,cutCourseSelect.value);cut1.value=c.CUT1==='-'?'':c.CUT1;cut2.value=c.CUT2==='-'?'':c.CUT2;cut3.value=c.CUT3==='-'?'':c.CUT3}
function renderAll(){renderStats();refreshDropdowns();renderLabels();renderTable()}
function quickAddRecord(ev){const t=prompt(`${ev} 기록 입력\n예: 1:01.86`);if(!t)return;data.records.push({swimmer:currentSwimmer,date:new Date().toISOString().slice(0,10),course:currentCourse,meet:'',event:ev,time:t.trim(),note:''});saveData();renderAll()}
function switchScreen(name){document.querySelectorAll('main').forEach(x=>x.classList.add('hidden'));document.getElementById(`screen-${name}`).classList.remove('hidden');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));if(name==='cuts')refreshDropdowns()}
function setCourse(course){currentCourse=course;courseLCM.classList.toggle('active',course==='LCM');courseSCY.classList.toggle('active',course==='SCY');refreshDropdowns();renderTable()}
normalizeEvents();
document.querySelectorAll('.swimmer-tab').forEach(b=>b.addEventListener('click',()=>{currentSwimmer=b.dataset.swimmer;renderAll()}));
courseLCM.addEventListener('click',()=>setCourse('LCM'));courseSCY.addEventListener('click',()=>setCourse('SCY'));
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));
document.addEventListener('click',e=>{const cell=e.target.closest('.event-entry-cell');if(cell)quickAddRecord(cell.dataset.event);const rm=e.target.closest('[data-remove]');if(rm){swimmerEvents[currentSwimmer]=(swimmerEvents[currentSwimmer]||[]).filter(x=>x!==rm.dataset.remove);saveEvents();renderAll()}});
cutEventSelect.addEventListener('change',loadCutForm);cutCourseSelect.addEventListener('change',()=>{currentCourse=cutCourseSelect.value;courseLCM.classList.toggle('active',currentCourse==='LCM');courseSCY.classList.toggle('active',currentCourse==='SCY');refreshDropdowns();renderTable()});
saveCutsBtn.addEventListener('click',()=>{const ev=cutEventSelect.value;if(!ev)return;const c=ensureCuts(currentSwimmer,ev,cutCourseSelect.value);c.CUT1=cut1.value.trim()||'-';c.CUT2=cut2.value.trim()||'-';c.CUT3=cut3.value.trim()||'-';saveData();renderTable();alert('CUT 저장됨')});
saveLabelsBtn.addEventListener('click',()=>{cutLabels[currentSwimmer]=[label1.value.trim()||'CUT 1',label2.value.trim()||'CUT 2',label3.value.trim()||'CUT 3'];saveLabels();renderLabels();renderTable();alert('기준 이름 저장됨')});
quickAddEventBtn.addEventListener('click',()=>{const v=prompt('새 종목 이름\n예: 200 IM');if(!v)return;const ev=v.trim();if(!ev)return;const tagged=`${currentCourse}|${ev}`;if(!swimmerEvents[currentSwimmer])swimmerEvents[currentSwimmer]=[];if(!swimmerEvents[currentSwimmer].includes(tagged)){swimmerEvents[currentSwimmer].push(tagged);saveEvents();renderAll();cutEventSelect.value=ev;loadCutForm()}});
renderAll();switchScreen('dashboard');
</script>
</body>
</html>

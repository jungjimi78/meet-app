name: Fix Jayha official standards
on:
  push:
    paths: ['.github/workflows/fix-jayha-official-standards.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct verified SCS standards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          # Official SCS 2026 Elite/JAG + 2025 WAG, boys SCY.
          j11={
          '50 Free':['27.40','28.60','28.60'],'100 Free':['59.30','1:02.00','1:03.00'],'200 Free':['2:09.60','2:17.60','2:18.90'],'500 Free':['5:48.80','6:15.50','6:21.20'],
          '100 IM':['1:19.50','N/A','1:25.60'],'200 IM':['2:49.90','3:02.60','3:07.80']}
          j13={
          '50 Free':['24.60','25.20','25.50'],'100 Free':['53.20','54.90','55.40'],'200 Free':['1:56.20','2:01.60','2:01.90'],'500 Free':['5:16.90','5:36.20','5:37.70'],
          '50 Back':['27.69','28.89','28.89'],'100 Back':['1:01.40','1:06.00','1:05.10'],'200 Back':['2:13.30','2:25.40','2:25.00'],
          '50 Breast':['31.69','33.09','33.09'],'100 Breast':['1:08.10','1:12.20','1:13.30'],'200 Breast':['2:29.70','2:40.50','2:39.30'],
          '50 Fly':['27.19','28.39','28.39'],'100 Fly':['59.40','1:02.20','1:02.80'],'200 Fly':['2:18.10','2:33.70','2:33.70'],
          '200 IM':['2:12.10','2:17.70','2:17.50'],'400 IM':['4:45.00','5:05.00','5:11.00']}
          def patch_obj(objname, vals):
            global s
            a=s.index('const '+objname+'={'); b=s.index('};',a)+2
            block=s[a:b]
            for ev,v in vals.items():
              pat=r"('"+re.escape(ev)+r"-SCY':)\[[^\]]*\]"
              repl=r"\1"+repr(v).replace(' ','')
              block,n=re.subn(pat,repl,block,count=1)
              if n==0: print('missing',objname,ev)
            s=s[:a]+block+s[b:]
          patch_obj('jayhaDefaults',j11); patch_obj('jayha13Defaults',j13)
          # Always repair stored SCY CUTs so old incorrect defaults do not survive localStorage.
          if 'function repairJayhaOfficialScy()' not in s:
            js11=str(j11).replace('None','null').replace("'",'"')
            js13=str(j13).replace('None','null').replace("'",'"')
            fn=f'''function repairJayhaOfficialScy(){{const a={js11},b={js13};for(const [ev,v] of Object.entries(a)){{const k=`Jayha-${{ev}}-SCY`;data.cuts[k]={{...(data.cuts[k]||{{}}),CUT1:v[0],CUT2:v[1],CUT3:v[2]}}}}for(const [ev,v] of Object.entries(b)){{const k=`Jayha13-${{ev}}-SCY`;data.cuts[k]={{...(data.cuts[k]||{{}}),CUT1:v[0],CUT2:v[1],CUT3:v[2]}}}}saveData()}}\n'''
            s=s.replace('function normalizeEvents(){',fn+'function normalizeEvents(){',1)
            s=s.replace('normalizeEvents();applyEventUpdates();migrateJayha13ShortWag();','normalizeEvents();applyEventUpdates();migrateJayha13ShortWag();repairJayhaOfficialScy();',1)
            s=s.replace('normalizeEvents();applyEventUpdates();','normalizeEvents();applyEventUpdates();repairJayhaOfficialScy();',1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Correct Jayha SCY standards from official SCS tables'
          git push
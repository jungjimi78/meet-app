name: Apply Jayha course standards
on:
  push:
    paths:
      - '.github/workflows/apply-jayha-course-standards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # 13-14 SCY third column: replace SAG with official 2025 WAG values.
          vals={'50 Free':'25.50','100 Free':'55.40','200 Free':'2:01.90','500 Free':'5:37.70','50 Back':'28.89','100 Back':'1:05.10','200 Back':'2:25.00','50 Breast':'33.09','100 Breast':'1:13.30','200 Breast':'2:39.30','50 Fly':'28.39','100 Fly':'1:02.80','200 Fly':'2:33.70','200 IM':'2:17.50','400 IM':'5:11.00'}
          import re
          for ev,nw in vals.items():
            pat=r"('"+re.escape(ev)+r"-SCY':\[[^\]]+?,[^\]]+?,)'[^']*'(\])"
            s,n=re.subn(pat,lambda m:m.group(1)+repr(nw)+m.group(2),s,count=1)
          # Course-specific third label for Jayha.
          marker="function renderTable(){const labels=cutLabels[currentSwimmer];"
          if marker in s:
            s=s.replace(marker,"function displayLabels(){const l=[...cutLabels[currentSwimmer]];if(currentSwimmer==='Jayha')l[2]=currentCourse==='SCY'?'WAG':'SAG';return l}\nfunction renderTable(){const labels=displayLabels();",1)
          else:
            s=s.replace("function renderTable(){const labels=displayLabels();","function renderTable(){const labels=displayLabels();",1)
          # Migrate already-stored 13-14 SCY SAG values to WAG without touching custom values.
          if 'function migrateJayha13ShortWag()' not in s:
            insert="function migrateJayha13ShortWag(){const oldSag={'50 Free':'25.00','100 Free':'54.90','200 Free':'2:01.60','500 Free':'5:36.20','50 Back':'28.89','100 Back':'1:06.00','200 Back':'2:25.40','50 Breast':'33.09','100 Breast':'1:12.20','200 Breast':'2:40.50','50 Fly':'28.39','100 Fly':'1:01.80','200 Fly':'2:33.70','200 IM':'2:16.60','400 IM':'5:04.80'};for(const [ev,old] of Object.entries(oldSag)){const k=`Jayha13-${ev}-SCY`,c=data.cuts[k],nw=jayha13Defaults[`${ev}-SCY`]?.[2];if(c&&nw&&(c.CUT3==null||c.CUT3==='-'||c.CUT3===old))c.CUT3=nw;}saveData()}\n"
            s=s.replace('function normalizeEvents(){',insert+'function normalizeEvents(){',1)
            s=s.replace('normalizeEvents();applyEventUpdates();','normalizeEvents();applyEventUpdates();migrateJayha13ShortWag();',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Use WAG for Jayha short course and SAG for long course"
          git push

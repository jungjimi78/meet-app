name: Fix Jayha verified SCS standards
on:
  push:
    paths: ['.github/workflows/fix-jayha-verified-scs.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified Jayha SCY standards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          # Official SCS boys: [2026 Elite, 2026 JAG, 2025 WAG]
          j11={
            '50 Free':['27.40','28.60','28.60'],
            '100 Free':['59.30','1:02.00','1:03.00'],
            '200 Free':['2:09.60','2:17.60','2:18.90'],
            '500 Free':['5:48.80','6:15.50','6:21.20'],
            '50 Back':['32.50','34.30','34.50'],
            '100 Back':['1:09.00','1:14.90','1:15.10'],
            '200 Back':['N/A','N/A','2:25.00'],
            '50 Breast':['36.00','39.00','39.30'],
            '100 Breast':['1:18.40','1:24.10','1:25.20'],
            '50 Fly':['30.40','31.90','32.60'],
            '100 Fly':['1:07.90','1:14.10','1:14.40'],
            '100 IM':['1:19.50','N/A','1:25.60'],
            '200 IM':['2:49.90','3:02.60','3:07.80']
          }
          j13={
            '50 Free':['24.60','25.20','25.50'],
            '100 Free':['53.20','54.90','55.40'],
            '200 Free':['1:56.20','2:01.60','2:01.90'],
            '500 Free':['5:16.90','5:36.20','5:37.70'],
            '50 Back':['27.69','28.89','28.89'],
            '100 Back':['1:01.40','1:06.00','1:05.10'],
            '200 Back':['2:13.30','2:25.40','2:25.00'],
            '50 Breast':['31.69','33.09','33.09'],
            '100 Breast':['1:08.10','1:12.20','1:13.30'],
            '200 Breast':['2:29.70','2:40.50','2:39.30'],
            '50 Fly':['27.19','28.39','28.39'],
            '100 Fly':['59.40','1:02.20','1:02.80'],
            '200 Fly':['2:18.10','2:33.70','2:33.70'],
            '200 IM':['2:12.10','2:17.70','2:17.50'],
            '400 IM':['4:45.00','5:05.00','5:11.00']
          }
          def patch_const(name, vals):
            global s
            a=s.index('const '+name+'={'); b=s.index('};',a)+2
            block=s[a:b]
            for ev,v in vals.items():
              key=ev+'-SCY'
              pat=r"('"+re.escape(key)+r"':)\[[^\]]*\]"
              rep=lambda m:m.group(1)+str(v).replace(' ','')
              block,n=re.subn(pat,rep,block,count=1)
              if n==0:
                block=block[:-2]+","+repr(key)+":"+str(v).replace(' ','')+block[-2:]
            s=s[:a]+block+s[b:]
          patch_const('jayhaDefaults',j11)
          patch_const('jayha13Defaults',j13)
          # Replace any earlier repair function with a verified repair that overwrites CUT columns only.
          start=s.find('function repairJayhaVerifiedScy()')
          if start!=-1:
            end=s.find('\nfunction ',start+10)
            if end!=-1: s=s[:start]+s[end+1:]
          js11=str(j11).replace("'",'"'); js13=str(j13).replace("'",'"')
          fn=f'''function repairJayhaVerifiedScy(){{const a={js11},b={js13};for(const [ev,v] of Object.entries(a)){{const k=`Jayha-${{ev}}-SCY`;data.cuts[k]={{...(data.cuts[k]||{{}}),CUT1:v[0],CUT2:v[1],CUT3:v[2]}}}}for(const [ev,v] of Object.entries(b)){{const k=`Jayha13-${{ev}}-SCY`;data.cuts[k]={{...(data.cuts[k]||{{}}),CUT1:v[0],CUT2:v[1],CUT3:v[2]}}}}saveData()}}\n'''
          s=s.replace('function normalizeEvents(){',fn+'function normalizeEvents(){',1)
          # Ensure it runs after other migrations/repairs, so verified values win.
          anchor='renderAll();'
          s=s.replace(anchor,'repairJayhaVerifiedScy();'+anchor,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Correct Jayha SCY standards from official SCS tables'
          git push